spring.application.name=medical-saas
# ===============================
# Server / Tomcat
# ===============================
server.port=8080

# Context path si despliegas WAR en Tomcat (opcional)
# server.servlet.context-path=/medica

# Headers correctos detras de Nginx / Proxy
server.forward-headers-strategy=framework

# ===============================
# Datasource - MySQL
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/medica_saas?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=medica
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
#spring.jpa.hibernate.ddl-auto=update

# Mostrar SQL (solo dev)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Timezone consistente
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Optimizacion basica
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=BINARY

# ===============================
# Jackson
# ===============================
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# ===============================
# Scheduler
# ===============================
spring.task.scheduling.pool.size=5

billing.poll.enabled=true
billing.poll.fixed-delay-ms=300000

# ===============================
# Paguelo Facil - Sandbox
# ===============================
paguelofacil.base-url=https://sandbox.paguelofacil.com
paguelofacil.access-token=${PAGUELOFACIL_ACCESS_TOKEN}
paguelofacil.id-payment-station=4
paguelofacil.timeout-ms=8000

# Paguelo Facil Link de Pago (Sandbox)
paguelofacil.link.base-url=https://sandbox.paguelofacil.com
paguelofacil.link.endpoint=/LinkDeamon.cfm

paguelofacil.cclw=${PAGUELOFACIL_CCLW}
paguelofacil.expires-in=1800

# URLs de tu app (para RETURN_URL y Webhook)
#app.public-base-url=http://localhost:8080
app.public-base-url=http://localhost:4200
app.return-url=${app.public-base-url}/billing/return
app.webhook-url=${app.public-base-url}/api/billing/webhook/paguelofacil
# ===============================
# Billing
# ===============================
billing.subscription-amount=100.00
billing.currency=USD
# ===============================
# Logging
# ===============================
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.engine.jdbc.env.internal.JdbcEnvironmentInitiator=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# Log en archivo (recomendado en VPS)
#logging.file.name=/var/log/medica-saas/application.log
# ===============================
# Actuator
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=WHEN_AUTHORIZED
# ===============================
# Seguridad basica
# ===============================
spring.security.filter.order=10
# ===============================
# Seguridad JWT
# FIX 4: NUNCA hardcodear el secret en código fuente.
# En desarrollo: usa variable de entorno JWT_SECRET
# En produccion: inyectar via Docker secret, Vault, o env var del VPS
# El fallback solo existe para desarrollo local (min 32 chars para HS256)
# ===============================
#security.jwt.secret=${JWT_SECRET:devOnlyFallback_CHANGE_IN_PROD_32ch!}
# Access token: 60 minutos (1 hora)
security.jwt.expiration-minutes=60

# Refresh token: 10080 minutos (7 días)
security.jwt.refresh-expiration-minutes=10080

# Issuer claim (validado en decode)
app.jwt.issuer=medica-saas
# ===============================
# Multipart / Uploads
# ===============================
#Tamaño máximo del archivo escaneado en MB
app.scanned-upload.max-size-mb=10
 
#IMPORTANTE: también subir los límites de Spring multipart, que por default
#son 1MB (file) y 10MB (request). Deben ser >= al límite de la app:
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
# ===============================
# Email (SMTP)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Remitente que aparece en los emails
medica.email.from=${SMTP_USERNAME}
medica.email.from-name=Medica SaaS
# ===============================
# Business Timezone
# ===============================
app.default-timezone=America/Panama
app.audit.system-user-id=00000000-0000-0000-0000-000000000001
app.audit.system-tenant-id=00000000-0000-0000-0000-000000000000
spring.threads.virtual.enabled=true
# Notificaciones WhatsApp (Twilio)
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.whatsapp-from=${TWILIO_WHATSAPP_NUMBER:}
# Storage de fotos médicas en produccion
#medica.storage.base-path=/var/medica/uploads
# Storage de fotos médicas en produccion
#medica.storage.base-path=./uploads
# Para producción (R2):
medica.storage.type=s3
medica.storage.s3.endpoint=${R2_ENDPOINT}
medica.storage.s3.bucket=${R2_BUCKET}
medica.storage.s3.access-key=${R2_ACCESS_KEY}
medica.storage.s3.secret-key=${R2_SECRET_KEY}
medica.storage.s3.region=auto
# Días de gracia después de vencimiento (default: 5)
billing.grace-period-days=5
# ===============================
# Cifrado de secretos MFA (AES-GCM)
# Generar: openssl rand -base64 32
# ===============================
security.mfa.encryption-key=${MFA_ENCRYPTION_KEY}

# ===============================
# Anti fuerza bruta (login + MFA verify)
# ===============================
security.login.max-attempts=5
security.login.lock-minutes=15
security.login.attempt-window-minutes=15

# ===============================
# Seguridad JWT
# NUNCA hardcodear el secret. Debe inyectarse via env var JWT_SECRET
# (Docker secret / Vault / env del VPS). Mínimo 32 chars para HS256.
# Sin esta variable la app NO arranca (intencional, fail-fast).
# ===============================
security.jwt.secret=${JWT_SECRET}

# ===============================
# Cache de estado de suscripción (hot path del enforcement filter)
# TTL corto: balancea frescura vs carga de BD. Se invalida al pagar.
# ===============================
billing.status-cache.ttl-seconds=30
# ===============================
# Migración única de secretos MFA a formato cifrado.
# Poner en true UNA vez por entorno tras desplegar el cifrado AES-GCM.
# Volver a false (o eliminar MfaSecretMigrationRunner) tras ejecutarla.
# ===============================
security.mfa.migrate-plaintext-secrets=false
# Exigir que el monto del webhook coincida con el de la transacción.
# Ponlo en true SOLO cuando confirmes que PF envía el campo de monto
# (de lo contrario, fail-closed bloquearía todos los pagos).
paguelofacil.webhook.require-amount-match=false
# Verificación server-to-server contra PF antes de activar (defensa principal).
# Mantener true en producción. En sandbox, ponlo en false SOLO si el endpoint
# de consulta no está disponible y quieres probar el resto del flujo.
paguelofacil.verify-with-provider=true
# ===============================
# Flyway (reemplaza ddl-auto=update)
# ===============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# Hibernate ya NO modifica el schema. Solo valida que las entidades
# coincidan con las tablas que Flyway gestiona.
spring.jpa.hibernate.ddl-auto=validate

